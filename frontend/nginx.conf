server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Disable sendfile: on network/overlay filesystems (e.g. /run/media) nginx
    # can serve stale/truncated versions of files after an in-place edit,
    # which can leave the page without its <script> tag (no JS -> no buttons).
    sendfile off;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
