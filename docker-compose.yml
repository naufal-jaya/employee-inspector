services:
  backend:
    build: ./backend
    container_name: ppe-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/model/weights:/app/model/weights:ro
    environment:
      - MODEL_WEIGHTS_PATH=/app/model/weights/best.pt
      - CONFIDENCE_THRESHOLD=0.4
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ppe-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
